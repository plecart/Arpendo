name: CI

on:
  pull_request:
    # `ready_for_review` est INDISPENSABLE ici : sans lui, aucun événement n'est émis au passage
    # draft → ready, et la CI ne tournerait jamais sur une PR ouverte en draft (Étape 2 de
    # `cycle-pr`). Ne pas retirer ce type sans retirer aussi le garde `if:` du job.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  ci:
    name: Lint + Type-check + Test
    runs-on: ubuntu-latest

    # Pas de CI tant que la PR est en draft.
    #
    # `cycle-pr` ouvre la PR AVANT d'écrire la moindre ligne de code (Étape 2), pour rendre le
    # travail visible comme « en cours ». Sans ce garde, chaque push de développement
    # déclencherait un run complet sur du code volontairement incomplet.
    #
    # C'est sans risque dans cette pipeline : les étapes 3.2 et 3.4 imposent une suite verte en
    # local avant chaque commit, donc aucun commit cassé n'entre dans l'historique. La CI reprend
    # au `gh pr ready` (Étape 5) et sur chaque push suivant.
    #
    # La condition sur `event_name` est nécessaire : sur un push vers `main`, l'objet
    # `pull_request` n'existe pas.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    # Fait sauter le préfixe `fvm` des recettes : le runner est jetable et n'a rien à isoler.
    # Rationale complète en tête du `justfile`, qui définit ces deux variables.
    env:
      FLUTTER_CMD: flutter
      DART_CMD: dart

    services:
      # PostgreSQL 17 : disponible chez tous les hébergeurs managés UE, supporté jusqu'en
      # novembre 2029, et le projet n'utilise aucune fonctionnalité postérieure — H3 est stocké
      # en BIGINT sans extension (cadrage §13.6). Le service managé doit être commandé dans la
      # même majeure : une CI qui teste sur une autre ne prouve rien sur les migrations.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      valkey:
        image: valkey/valkey:8
        # Mot de passe même sur un runner jetable. Le §13.10 exige un Valkey authentifié dans
        # tous les environnements ; une CI qui tournerait sans lui validerait une configuration
        # que personne ne déploie. `VALKEY_EXTRA_FLAGS` est le mécanisme de l'image officielle,
        # le même que `infra/docker-compose.yml` emploie en local.
        #
        # Valeur en clair, et répétée trois fois — ici, dans la sonde, et dans le step Tests.
        # Le contexte `env` n'est pas disponible dans `services`, donc rien ne peut la factoriser :
        # **les trois doivent rester identiques**. Ce n'est pas un secret : le conteneur naît et
        # meurt avec le job et ne contient rien.
        env:
          VALKEY_EXTRA_FLAGS: --requirepass valkey-de-ci
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli --no-auth-warning -a valkey-de-ci ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      # Versions d'actions tenues à jour par Dependabot (cadrage §13.11).
      #
      # Version exacte, pas de majeur flottant : `setup-uv` ne publie plus de tag `vN` depuis
      # sa v8 (« Remove update-major-minor-tags workflow »). `@v10` n'existe pas et fait échouer
      # le workflow avant la première étape. Dependabot monte ce tag exact comme un autre.
      - name: Setup uv + Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # Aucune version de Python ici : `uv sync` (recette `install-api`) lit
          # `api/.python-version`, source unique, et installe l'interpréteur qu'il faut.
          enable-cache: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Source unique de la version, partagée avec le poste de dev (cf. `env` du job).
          # Pas de `channel:` ici : il serait une seconde déclaration concurrente de `.fvmrc`.
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: true

      - name: Setup just
        uses: extractions/setup-just@v4

      - name: Install
        run: just install

      - name: Lint
        run: just lint

      - name: Format check
        run: just fmt-check

      - name: Typecheck
        run: just typecheck

      # Exigera le secret `MAPBOX_DOWNLOADS_TOKEN` dès que `mapbox_maps_flutter` sera une
      # dépendance (téléchargement du SDK Android au build) — README « Ce qui reste ouvert », n°5.
      - name: Build
        run: just build

      - name: Tests
        # Coordonnées des conteneurs `services` ci-dessus — les tests parlent à de vrais
        # PostgreSQL et Valkey, jamais à des doubles. Ce sont les sept variables que
        # `arpendo_api.core.settings.Settings` lit, et les seules : toute autre est absente parce
        # qu'aucun code ne la lit encore — y compris les deux seuils de version du client, qui
        # ne parlent à aucun service mais que `Settings` exige sans défaut.
        #
        # `FORWARDED_ALLOW_IPS` n'y figure pas, bien qu'elle soit dans `.env.example` : elle est
        # lue par uvicorn, que la suite ne démarre jamais. Le test de la frontière de confiance
        # construit `ProxyHeadersMiddleware` lui-même — sinon il ne pourrait pas éprouver le pair
        # de confiance et le pair inconnu dans la même suite.
        #
        # `127.0.0.1` et non `localhost`, comme dans `.env.example` : une seule forme d'adresse
        # dans les trois environnements, et aucune dépendance à l'ordre du résolveur.
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/postgres
          # Base logique 1, comme sur le poste — et ce n'est pas une préférence
          # d'homogénéité : `tests/test_isolation.py` tourne ici aussi, y lit le compose du
          # dépôt et le compare à cet environnement. Avec la base 0, la CI serait rouge.
          VALKEY_URL: redis://127.0.0.1:6379/1
          VALKEY_PASSWORD: valkey-de-ci
          RATE_LIMIT_IP_REQUESTS: "600"
          RATE_LIMIT_IP_WINDOW_SECONDS: "60"
          CLIENT_BUILD_MIN: "1"
          CLIENT_BUILD_RECOMMENDED: "1"
        run: just test
