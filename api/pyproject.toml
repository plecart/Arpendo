[project]
name = "arpendo-api"
version = "0.1.0"
description = "Arpendo — couche de services du jeu, servie par l'api HTTP."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "structlog>=26.1.0",
    "uuid6>=2025.0.1",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.9"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# Sans ce greffon, mypy lit `Settings()` comme un appel de modèle Pydantic et réclame les trois
# champs en arguments — alors que c'est précisément l'environnement qui les fournit. Le greffon
# connaît `BaseSettings` et rend ses champs facultatifs à la construction.
plugins = ["pydantic.mypy"]

# Le test d'intégration du worker exécute du code du paquet dans un SECOND processus. Sans cette
# option, ses lignes ne sont pas comptées : pytest-cov 7 a retiré son support des sous-processus et
# renvoie aux « patch options » de coverage, qui font le travail à sa place. Poser `subprocess`
# active aussi `parallel` — chaque processus écrit sa propre mesure, et pytest-cov les combine.
[tool.coverage.run]
patch = ["subprocess"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]


[tool.alembic]
# Sans `alembic.ini` : l'URL de la base vient de `Settings` (cadrage §13.9 règle 5) et le logging
# est configuré par `configure_logging()`, appelée depuis `env.py` — l'ini n'aurait rien porté que
# le paquet ne pose déjà, et l'aurait posé deux fois. `%(here)s` est le dossier de ce fichier :
# `api/` sur le poste, `/app` dans le conteneur, où les scripts entrent par le `COPY src` du
# Dockerfile. Même commande partout : `alembic upgrade head`.
script_location = "%(here)s/src/arpendo_api/db/migrations"
# Date en tête du nom de fichier : les migrations se lisent dans l'ordre où elles sont nées.
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s"

# Le fichier généré passe par ruff avant d'être relu : imports triés et nettoyés, puis formaté.
# **L'ordre compte** : Alembic exécute les hooks dans l'ordre de déclaration, `check --fix` retire
# les imports que l'autogénération n'utilise pas, et la ligne vide qu'il laisse derrière n'est
# nettoyée que par `format`. L'inverse ferait rougir `just fmt-check` sur une migration neuve.
# Il reste à RELIRE le fichier — l'autogénération ne voit ni les renommages ni les données.
[[tool.alembic.post_write_hooks]]
name = "ruff-fix"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff-format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"
