name: arpendo
description: "Jeu mobile de conquête territoriale en géolocalisation réelle."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  connectivity_plus: ^7.3.1
  flutter:
    sdk: flutter
  http: ^1.6.0
  # Jeu d'icônes unique de l'interface, graisse Regular (spec UX §1.8). Seul
  # `lib/ui/core/theme/icones.dart` l'importe.
  phosphor_icons: ^3.0.1

dev_dependencies:
  # Déjà dans l'arbre en transitive de `connectivity_plus` ; déclarée ici pour
  # que les tests puissent poser une plateforme feinte. Rien de plus n'entre
  # dans l'arbre, et rien n'est livré.
  connectivity_plus_platform_interface: ^2.1.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
