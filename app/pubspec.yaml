name: arpendo
description: "Jeu mobile de conquête territoriale en géolocalisation réelle."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  connectivity_plus: ^7.3.1
  flutter:
    sdk: flutter
  # Rend le signe de la marque (`assets/signe-arpendo.svg`) teinté par le
  # thème. Seul `lib/ui/core/marque/bloc_de_marque.dart` l'importe.
  flutter_svg: ^2.2.0
  # Délégués `Global*Localizations` du SDK, montés par la classe générée depuis
  # `lib/l10n/app_fr.arb` (cadrage §12.6 : aucune chaîne en dur).
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  # Exigée par le code que `gen-l10n` produit. La contrainte est laissée au SDK,
  # qui épingle la version que sa propre génération attend.
  intl: any
  # Version installée (`version: x.y.z+N` du pubspec) : source unique du
  # numéro de build comparé aux seuils de `/version`. Seul `main.dart`
  # l'importe.
  package_info_plus: ^10.2.1
  # Jeu d'icônes unique de l'interface, graisse Regular (spec UX §1.8). Seul
  # `lib/ui/core/theme/icones.dart` l'importe.
  phosphor_icons: ^3.0.1
  # Injection des services depuis la racine de composition (brief #46 :
  # `provider` entre avec le premier ViewModel). Seul `main.dart` l'importe.
  provider: ^6.1.2
  # Remontée des erreurs (cadrage §13.10, §13.11). Seul
  # `lib/data/services/rapport_erreurs.dart` l'importe — c'est lui qui décide
  # d'initialiser le SDK ou de n'y toucher jamais, et qui assainit chaque
  # événement avant l'envoi.
  sentry_flutter: ^9.29.0
  # Ouvre la fiche du magasin depuis l'écran bloquant et le bandeau 12
  # (UX §11.2). Seul `lib/data/services/magasin_service.dart` l'importe.
  url_launcher: ^6.3.2

dev_dependencies:
  # Déjà dans l'arbre en transitive de `connectivity_plus` ; déclarée ici pour
  # que les tests puissent poser une plateforme feinte. Rien de plus n'entre
  # dans l'arbre, et rien n'est livré.
  connectivity_plus_platform_interface: ^2.1.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Les actifs de la marque, copiés tels quels depuis `documents/assets/`
  # (source unique, README racine) — toute retouche se fait là-bas d'abord.
  assets:
    - assets/
  # Exigé par `flutter gen-l10n` : sans ce drapeau, l'outil refuse d'écrire la
  # classe. Il ne suffit pas pour autant — c'est `just l10n` qui dérive d'abord
  # la locale `fr-XA`, que la génération seule ignorerait.
  generate: true
