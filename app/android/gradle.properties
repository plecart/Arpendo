org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
# Le démon Kotlin 2.4.0 plante sur ses caches incrémentaux (« Could not close incremental
# caches … already registered », AssertionError dans le démon) à la compilation des modules de
# plugins — reproduit à froid sur `package_info_plus`, démons arrêtés et build purgé (#46,
# lot 2b, poste Windows). L'incrémental ne fait rien gagner ici : ces modules ne se recompilent
# qu'au changement de version du plugin.
kotlin.incremental=false
